root:
  branch_id: branch-root
  parent_branch_id: null
  owned_paths:
    - toy-app/
  provides:
    - integrated_branch_status_summary
  consumes: []
  acceptance_criteria:
    - all child branch exit conditions satisfied
    - parent aggregation matrices show no unresolved blocker
    - final integration has no shared-path conflict
  exit_condition: root goal accepted by quality gate
  risk_level: medium
  owner_mode: orchestrator
  owner_model: GPT decision layer
  needs_decomposition: true
  max_depth: 2
  children:
    - branch_id: branch-domain
      parent_branch_id: branch-root
      owned_paths:
        - toy-app/domain/branch-summary.ts
        - toy-app/domain/branch-status.ts
      provides:
        - BranchStatusSummary domain contract
        - aggregation semantics for status counts
      consumes:
        - root goal success criteria
      acceptance_criteria:
        - status counts are deterministic
        - blocked count handles zero and multiple blocked branches
        - no API formatting logic in domain layer
      exit_condition: domain summary behavior accepted by tests branch
      risk_level: medium
      owner_mode: executor
      owner_model: DeepSeek execution layer
    - branch_id: branch-api
      parent_branch_id: branch-root
      owned_paths:
        - toy-app/api/branch-summary-route.ts
        - toy-app/api/branch-summary-schema.ts
      provides:
        - API response contract
        - backward-compatible optional summary field
      consumes:
        - BranchStatusSummary domain contract
      acceptance_criteria:
        - response schema accepts the new summary
        - existing clients can ignore the field
        - mapper has no hidden domain computation
      exit_condition: API contract accepted after domain branch provides contract
      risk_level: medium
      owner_mode: executor
      owner_model: DeepSeek execution layer
    - branch_id: branch-test
      parent_branch_id: branch-root
      owned_paths:
        - toy-app/tests/branch-status-summary.test.ts
        - toy-app/fixtures/branches.json
      provides:
        - behavior tests
        - API contract tests
      consumes:
        - domain aggregation semantics
        - API response contract
      acceptance_criteria:
        - tests cover empty, mixed, and blocked branch sets
        - fixtures include compatibility case without summary
        - failing test would catch missing mapper update
      exit_condition: test suite documents expected behavior
      risk_level: low
      owner_mode: reviewer
      owner_model: GPT decision layer
    - branch_id: branch-docs
      parent_branch_id: branch-root
      owned_paths:
        - docs/branch-status-summary.md
        - docs/api-branch-summary.md
      provides:
        - public contract notes
        - migration and rollback note
      consumes:
        - final API shape
      acceptance_criteria:
        - docs explain optional field and compatibility
        - docs do not claim unsupported lifecycle changes
        - rollback note is present
      exit_condition: docs match final integrated contract
      risk_level: low
      owner_mode: executor
      owner_model: DeepSeek execution layer
