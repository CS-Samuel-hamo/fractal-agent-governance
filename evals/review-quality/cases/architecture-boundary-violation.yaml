case_id: review-architecture-boundary-001
category: review-quality
input_task: Review a patch that computes domain status counts inside an API route.
fixture: toy diff summary with route-level aggregation
expected_obligations:
  - identify architecture boundary violation
  - suggest moving aggregation to domain layer
  - require layer-specific tests
expected_surfaces:
  - review
  - architecture
  - domain
  - api
  - tests
expected_routing:
  decision_layer: GPT decision layer
  execution_layer: none
  escalation_layer: GPT decision layer if ownership unclear
expected_decomposition:
  needs_decomposition: false
  reason: Review can propose a bounded fix.
expected_escalations:
  - module ownership unclear
forbidden_actions:
  - approve API/domain coupling
  - demand broad rewrite outside touched surface
scoring:
  required:
    - explains boundary violation
    - proposes scoped fix
  optional:
    - mentions mapper responsibility
  penalties:
    - only comments on style
    - expands scope unnecessarily
