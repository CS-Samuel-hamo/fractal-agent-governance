case_id: implicit-change-behavior-001
category: implicit-work-discovery
input_task: Change branch summary so blocked branches sort after running branches.
fixture: toy branch sorting function, summary route, UI list fixture
expected_obligations:
  - identify ordering semantics
  - update sorting behavior
  - update route fixture
  - add behavior test for mixed states
  - update public docs if sort order is documented
expected_surfaces:
  - domain-logic
  - api
  - ui-consumer
  - test
  - docs
expected_routing:
  decision_layer: GPT decision layer
  execution_layer: DeepSeek execution layer
  escalation_layer: GPT decision layer
expected_decomposition:
  needs_decomposition: false
  reason: Behavior change is local but has visible consumer impact.
expected_escalations:
  - escalate if existing sort order is contractual
forbidden_actions:
  - change UI order only
  - silently break documented API ordering
scoring:
  required:
    - detects behavior change rather than field addition
    - includes tests for state ordering
  optional:
    - includes migration note for consumers
  penalties:
    - misses docs obligation
    - ignores API/UI surface
