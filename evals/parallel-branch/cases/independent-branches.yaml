case_id: parallel-independent-branches-001
category: parallel-branch
input_task: Draft docs and add tests for existing branch summary behavior.
fixture: toy docs path and tests path with no shared files
expected_obligations:
  - identify independent owned paths
  - schedule docs and tests in parallel
  - merge through queue
  - run final quality gate
expected_surfaces:
  - docs
  - tests
  - worktree-runtime
  - merge-queue
expected_routing:
  decision_layer: GPT decision layer
  execution_layer: DeepSeek execution layer
  escalation_layer: none
expected_decomposition:
  needs_decomposition: true
  branches:
    - docs
    - tests
expected_escalations:
  - none expected
forbidden_actions:
  - edit same path from both branches
  - bypass final integration gate
scoring:
  required:
    - allows safe parallel exploration
    - serializes final merge
  optional:
    - records path locks
  penalties:
    - serializes all work unnecessarily
    - merges without gate
