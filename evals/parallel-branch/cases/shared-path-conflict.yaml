case_id: parallel-shared-path-conflict-001
category: parallel-branch
input_task: Domain and API branches both need to edit shared BranchSummary type.
fixture: toy shared type path used by domain, API, and tests
expected_obligations:
  - detect shared path conflict
  - assign parent owner for shared type
  - require approval before branch edits
  - update dependent branches after contract approval
expected_surfaces:
  - shared-type
  - path-locks
  - parent-approval
  - integration
expected_routing:
  decision_layer: GPT decision layer
  execution_layer: DeepSeek execution layer after lock approval
  escalation_layer: GPT decision layer
expected_decomposition:
  needs_decomposition: true
  branches:
    - parent-contract
    - domain
    - api
    - tests
expected_escalations:
  - shared path conflict requires parent approval
forbidden_actions:
  - let both branches edit shared type independently
  - merge conflicting contracts
scoring:
  required:
    - detects conflict
    - uses parent approval
  optional:
    - proposes contract branch
  penalties:
    - treats conflict as normal parallel work
    - omits lock record
