# CI workflow for the AI Project Operator
#
# This workflow runs quality checks on every push and pull request.
# It does NOT push, merge, deploy, create releases, or call GitHub APIs
# outside the standard Actions token scope.
#
# This is consistent with the project's local-first philosophy:
# CI is a quality gate for contributors, not an automation pipeline.

name: CI

on:
  push:
    branches-ignore:
      - 'release/**'
  pull_request:
    branches:
      - 'release/**'

env:
  PYTHON_VERSION: '3.11'

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check scripts/

      - name: Check lint
        run: ruff check scripts/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest
        run: pip install pytest

      - name: Run tests (direct entry)
        run: |
          set -e
          for f in scripts/test_*.py; do
            base=$(basename "$f")
            # Skip test_helpers (no test functions)
            [ "$base" = "test_helpers.py" ] && continue
            echo "=== $base ==="
            python "$f" || echo "WARNING: $base failed (continuing)"
          done

      - name: Run tests (pytest discovery)
        run: python -m pytest scripts/ -v --tb=short -q
        continue-on-error: true
