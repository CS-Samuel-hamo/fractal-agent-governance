name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate open source package
        run: python scripts/validate-open-source-package.py

      - name: Check eval case YAML fields
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "case_id:",
              "category:",
              "input_task:",
              "fixture:",
              "expected_obligations:",
              "expected_surfaces:",
              "expected_routing:",
              "expected_decomposition:",
              "expected_escalations:",
              "forbidden_actions:",
              "scoring:",
          ]
          failures = []
          for path in sorted(Path("evals").glob("* /cases/*.yaml".replace(" ", ""))):
              text = path.read_text(encoding="utf-8")
              missing = [key for key in required if key not in text]
              if missing:
                  failures.append(f"{path}: missing {missing}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("eval case field check passed")
          PY
