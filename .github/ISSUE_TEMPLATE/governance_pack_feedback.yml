name: Governance pack feedback
description: Share results from trying the pack or demo workflows.
title: "[Feedback]: "
labels:
  - feedback
body:
  - type: dropdown
    id: workflow_tested
    attributes:
      label: Which workflow tested?
      options:
        - Implicit Work Discovery
        - Fractal Decomposition
        - Proc/Data Source Mismatch
        - Worktree Parallel Exploration
        - Eval Suite
        - Zoo Code Adapter
        - Other
    validations:
      required: true
  - type: textarea
    id: what_failed
    attributes:
      label: What failed?
      description: Describe the mismatch, friction, or confusing result.
    validations:
      required: true
  - type: dropdown
    id: strictness
    attributes:
      label: Was governance too strict or too loose?
      options:
        - Too strict
        - Too loose
        - About right
        - Mixed
        - Not sure
    validations:
      required: true
  - type: input
    id: model_used
    attributes:
      label: Model used
      placeholder: "Example: GPT decision layer, DeepSeek execution layer, other"
    validations:
      required: false
  - type: input
    id: repo_type
    attributes:
      label: Repo type
      placeholder: "Example: toy repo, library, web app, CLI, monorepo"
    validations:
      required: true
