name: Bug report
description: Report a reproducible problem with the governance runtime or examples.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Describe the local environment where the issue happened.
      placeholder: "Example: local checkout, VS Code, toy repo"
    validations:
      required: true
  - type: input
    id: zoo_roo_version
    attributes:
      label: Zoo/Roo version
      description: Provide the Zoo Code or Roo Code version if applicable.
      placeholder: "Example: Zoo Code x.y.z or not applicable"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Example: Windows 11, macOS, Ubuntu"
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs_without_secrets
    attributes:
      label: Logs without secrets
      description: Paste only redacted logs. Do not include API keys, tokens, credentials, real project paths, or customer data.
      render: text
    validations:
      required: false
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction steps
      description: List the smallest steps needed to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
